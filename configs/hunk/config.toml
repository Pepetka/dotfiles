theme = "tokyo-night-moon"
wrap_lines = true
menu_bar = false
sidebar = false
agent_notes = true
transparent_background = true
mode = "auto"
line_numbers = true
hunk_headers = true
copy_decorations = false
cursor_line = "row"

[keybindings]
# Half-page как <C-d>/<C-u> в nvim (дефолтные d/u тоже остаются)
"hunk.review.halfPageDown" = ["ctrl+d", "d"]
"hunk.review.halfPageUp" = ["ctrl+u", "u"]

# Файлы как буферы в nvim: Tab/S-Tab (дефолтные ./, тоже остаются)
"hunk.review.nextFile" = ["tab", "."]
"hunk.review.previousFile" = ["shift+tab", ","]

# Ханки на J/K: j/k — строки, J/K — ханки
"hunk.review.nextHunk" = ["J"]
"hunk.review.previousHunk" = ["K"]

# Аннотированные ханки (заметки) на ]/[
"hunk.review.nextAnnotatedHunk" = ["]"]
"hunk.review.previousAnnotatedHunk" = ["["]

